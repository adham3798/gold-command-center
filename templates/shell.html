<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOLD COMMAND CENTER</title>
<style>
  :root{
    --gold:#FFD700; --gold2:#FFA500; --green:#00FF88; --red:#FF2244;
    --blue:#00E5FF; --bg:#040810; --bg2:#0A1020; --panel:#0D1525;
    --border:#1A2A40; --text:#C8D8E8; --dim:#4A6080;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; background:var(--bg); color:var(--text);
    font-family:'Segoe UI',Tahoma,sans-serif; overflow:hidden;}
  .topbar{
    height:54px; display:flex; align-items:center; gap:18px;
    padding:0 16px; background:linear-gradient(90deg,#0A1020,#0F1830);
    border-bottom:2px solid var(--border); box-shadow:0 2px 14px rgba(0,0,0,.6);
    position:relative; z-index:10;
  }
  .brand{display:flex; align-items:baseline; gap:8px; white-space:nowrap;}
  .brand .logo{font-size:18px; font-weight:800; letter-spacing:2px;
    background:linear-gradient(90deg,var(--gold),var(--gold2));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  .brand .sub{font-size:11px; color:var(--dim); letter-spacing:3px;}
  .tabs{display:flex; gap:8px; margin-left:8px;}
  .tab{
    display:flex; align-items:center; gap:8px;
    padding:8px 18px; border:1px solid var(--border); border-radius:10px;
    background:var(--panel); color:var(--text); cursor:pointer;
    font-size:13px; font-weight:600; letter-spacing:.5px;
    transition:all .15s ease; user-select:none;
  }
  .tab:hover{border-color:var(--gold2); color:#fff;}
  .tab.active{
    background:linear-gradient(90deg,rgba(255,215,0,.18),rgba(255,165,0,.12));
    border-color:var(--gold); color:var(--gold);
    box-shadow:0 0 14px rgba(255,215,0,.25);
  }
  .tab .ico{font-size:16px;}
  .spacer{flex:1;}
  .hint{font-size:11px; color:var(--dim); white-space:nowrap;}
  .stage{position:absolute; top:54px; left:0; right:0; bottom:0;}
  iframe{
    position:absolute; inset:0; width:100%; height:100%;
    border:0; background:var(--bg); display:none;
  }
  iframe.active{display:block;}
  .loader{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; color:var(--dim); font-size:13px; letter-spacing:1px;
    pointer-events:none; transition:opacity .4s ease;
  }
  .loader .ring{
    width:40px; height:40px; border:3px solid var(--border);
    border-top-color:var(--gold); border-radius:50%;
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <span class="logo">GOLD COMMAND CENTER</span>
      <span class="sub">XAUUSD · ASTRO · INTRADAY</span>
    </div>
    <div class="tabs">
      <div class="tab active" data-target="gold">
        <span class="ico">🌙</span><span>Moon Calendar &amp; Predictions</span>
      </div>
      <div class="tab" data-target="adham">
        <span class="ico">⚡</span><span>ADHAM Intraday</span>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="hint">One server · localhost:5000 · switch views with the tabs</div>
  </div>

  <div class="stage">
    <iframe id="frame-gold"  class="active" src="/gold"  title="Moon Calendar &amp; Predictions"></iframe>
    <!-- Adham frame loads lazily on first click so its fetch loops don't start until viewed -->
    <iframe id="frame-adham" title="ADHAM Intraday"></iframe>
    <div class="loader" id="loader" style="display:none;">
      <div class="ring"></div><div>Loading ADHAM dashboard…</div>
    </div>
  </div>

<script>
  var tabs   = document.querySelectorAll('.tab');
  var frames = {
    gold:  document.getElementById('frame-gold'),
    adham: document.getElementById('frame-adham')
  };
  var loader = document.getElementById('loader');
  var adhamLoaded = false;

  function show(target){
    tabs.forEach(function(t){ t.classList.toggle('active', t.dataset.target === target); });

    if(target === 'adham' && !adhamLoaded){
      loader.style.display = 'flex';
      loader.style.opacity = '1';
      frames.adham.src = '/adham';
      adhamLoaded = true;
      frames.adham.addEventListener('load', function(){
        loader.style.opacity = '0';
        setTimeout(function(){ loader.style.display = 'none'; }, 400);
      }, { once:true });
    }

    Object.keys(frames).forEach(function(k){
      frames[k].classList.toggle('active', k === target);
    });
  }

  tabs.forEach(function(t){
    t.addEventListener('click', function(){ show(t.dataset.target); });
  });
</script>
</body>
</html>
